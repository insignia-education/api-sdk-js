name: Publish Package

on:
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger, for the coverage job below — publish only ever runs on push.

permissions:
  id-token: write  # Required for OIDC

jobs:
  publish:
    # push only — a manual run is for the coverage job below, never re-publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm ci
      - run: npm run build --if-present
      # npm test disabled: integration suite needs a live api backend, no CI service for it yet

      # The version in package.json is whatever was committed — this workflow never bumps it.
      # The pre-commit hook (.github/hooks/pre-commit) already refuses a commit whose version is
      # already published, so publishing here just fails loudly if someone forgot to bump it.
      - run: npm publish  # Or: npm stage publish

  # The fast gate on every push: jest --changedSince walks the module graph from
  # the files this push touched and runs only the tests reaching them. 'unit'
  # project only — 'integration' needs a live api backend, no CI service for it
  # yet (same reason the full `npm test` below stays disabled here). Independent
  # of publish, same as `coverage` below; add `needs: tests` to `publish` if
  # you'd rather it gate.
  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # --changedSince diffs against a ref; a shallow clone has nothing to diff.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          package-manager-cache: false
      - run: npm ci
      - name: Run affected tests
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          npx jest --selectProjects unit --changedSince "$BASE"

  # Independent of publish — a failure here never blocks a release. Only the 'unit'
  # project runs (the 'integration' project needs a live api backend, no CI service
  # for it yet — see the disabled `npm test` above), so this coverage is partial.
  # Uploaded to S3 for the admin-only coverage viewer in front
  # (CoverageReportController in api proxies it) — never baked into any deployed
  # image, and this repo has no deployed image anyway.
  coverage:
    # Manual only — trigger via Actions > Publish Package > Run workflow.
    # Was on every push; opt-in instead, same as api/front's coverage jobs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          package-manager-cache: false
      - run: npm ci
      - run: npx jest --selectProjects unit --coverage --coverageReporters=html
        continue-on-error: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws s3 sync coverage "s3://${{ vars.AWS_COVERAGE_BUCKET }}/api-sdk-js/latest" --delete
        if: always()