name: Publish Package

on:
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger, for the coverage job below — publish only ever runs on push.

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Required for the auto-bump-and-push step below

jobs:
  publish:
    # push only — a manual run is for the coverage job below, never re-publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm ci
      - run: npm run build --if-present
      # Full `npm test` (unit + integration) is not run here — the independent `tests` and
      # `integration-tests` jobs below cover both, and a failure there doesn't block this publish.

      # Self-healing safety net: the pre-commit hook (.github/hooks/pre-commit) is supposed to
      # catch a forgotten version bump before it's even committed, but it only runs locally and
      # can be skipped (--no-verify, or a commit made before the hook was installed). Rather than
      # let `npm publish` fail loudly here every time that happens, auto-bump the patch version
      # and push that commit back to master before publishing — so a forgotten bump costs nothing.
      - name: Auto-bump patch version if this one's already published
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PACKAGE" version 2>/dev/null || echo "")
          if [ "$CURRENT" = "$PUBLISHED" ]; then
            NEW=$(node -p "const v = require('./package.json').version.split('.'); v[2] = Number(v[2]) + 1; v.join('.')")
            node -e "
              const fs = require('fs');
              const p = require('./package.json');
              p.version = '$NEW';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            echo "package.json@${CURRENT} is already published — auto-bumped to ${NEW}."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "auto-bump version to ${NEW} [skip ci]"
            git push
          fi
      - run: npm publish  # Or: npm stage publish

  # The fast gate on every push: jest --changedSince walks the module graph from
  # the files this push touched and runs only the tests reaching them. 'unit'
  # project only — independent of publish, same as `coverage`/`integration-tests`
  # below; add `needs: tests` to `publish` if you'd rather it gate.
  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # --changedSince diffs against a ref; a shallow clone has nothing to diff.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          package-manager-cache: false
      - run: npm ci
      - name: Run affected tests
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          npx jest --selectProjects unit --changedSince "$BASE"

  # Same --changedSince fast-gate idea as `tests` above, applied to the
  # 'integration' project: only the ephemeral api-test + MySQL container pair
  # (see `make test-env-up` in the Makefile) is worth paying for when a change
  # actually reaches an integration test. Driven directly here instead of
  # through `make test` so the teardown step can run unconditionally via
  # `if: always()`. Independent of publish — a failure here never blocks a
  # release; add `needs: integration-tests` to `publish` if you'd rather it gate.
  integration-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # --changedSince diffs against a ref; a shallow clone has nothing to diff.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          package-manager-cache: false
      - run: npm ci
      - name: Resolve affected integration tests
        id: affected
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          # --listTests prints one absolute test-file path per line, but Jest 30 also
          # writes a "Running one project: integration" banner to stdout — left in, that
          # banner's own word "integration" matches every integration test's path (they
          # all live under tests/integration/), so the "affected" run below silently
          # widened into running the entire suite instead of just what changed. Keep only
          # lines that are actual test file paths.
          TESTS=$(npx jest --selectProjects integration --changedSince "$BASE" --listTests | grep '\.test\.js$' | tr '\n' ' ')
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          if [ -z "$TESTS" ]; then
            echo "No integration test covers this push — nothing to run."
          else
            echo "Affected: $TESTS"
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.affected.outputs.tests != ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write .env.test
        if: steps.affected.outputs.tests != ''
        # .env.test is gitignored (like any dotenv file) so it's never present on a
        # fresh checkout — CI was silently running every integration test against
        # the SDK's hardcoded default base URL (the real insigniaeducation.com)
        # instead of the ephemeral container, since INSIGNIA_EDUCATION_API_BASE_URL
        # was simply unset. None of this is a real secret: TEST_PASSWORD(_ADMIN) are
        # fixed values the ephemeral container's migrations seed verbatim (see the
        # Makefile's test-env-up comment), and the port matches TEST_API_PORT below.
        run: |
          cat > .env.test <<'EOF'
          INSIGNIA_EDUCATION_API_BASE_URL=http://localhost:8001
          TEST_EMAIL=roquendo@insigniaeducation.com
          TEST_PASSWORD=12345678
          TEST_EMAIL_ADMIN=rodolfoquendo@gmail.com
          TEST_PASSWORD_ADMIN=12345678
          EOF
      - name: Start ephemeral api-test + MySQL (see Makefile's test-env-up)
        if: steps.affected.outputs.tests != ''
        run: make test-env-up
      - name: Run affected integration tests
        if: steps.affected.outputs.tests != ''
        run: npx jest --selectProjects integration --runInBand --testTimeout=60000 ${{ steps.affected.outputs.tests }}
      - name: Dump api-test container logs on failure
        if: failure() && steps.affected.outputs.tests != ''
        run: docker logs api-sdk-test-api 2>&1 | tail -200
      - name: Tear down ephemeral test env
        if: always()
        run: make test-env-down

  # Independent of publish — a failure here never blocks a release. Only the 'unit'
  # project runs, so this coverage is partial (the 'integration' project above
  # doesn't produce coverage output). Uploaded to S3 for the admin-only coverage
  # viewer in front (CoverageReportController in api proxies it) — never baked
  # into any deployed image, and this repo has no deployed image anyway.
  coverage:
    # Manual only — trigger via Actions > Publish Package > Run workflow.
    # Was on every push; opt-in instead, same as api/front's coverage jobs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          package-manager-cache: false
      - run: npm ci
      - run: npx jest --selectProjects unit --coverage --coverageReporters=html
        continue-on-error: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws s3 sync coverage "s3://${{ vars.AWS_COVERAGE_BUCKET }}/api-sdk-js/latest" --delete
        if: always()