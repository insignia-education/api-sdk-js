name: Dependabot auto-merge

# Squash-merges Dependabot PRs for patch and minor updates as soon as they merge clean.
# Major updates are left open for a human. There is no PR test workflow in this repo, so nothing gates
# this beyond mergeability. Only PRs into master trigger it: the "Sync beta with master" PR is merged within
# seconds of opening, so a run on it starts against an already-merged PR and fails with "workflow file issue". A merge made with GITHUB_TOKEN does not trigger other workflows: the deploy
# and the master -> beta sync only run on the next normal push to master.

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
